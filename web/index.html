<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Open Arkham</title>
  <style>
    body { font-family: system-ui; max-width: 800px; margin: 2rem auto; }
    input { width: 100%; padding: 0.5rem; }
    pre { background: #f5f5f5; padding: 1rem; overflow: auto; }
  </style>
</head>
<body>
  <h1>Open Arkham</h1>
  <p>Free portfolio view from public RPCs, CoinGecko, and open labels. No proprietary data.</p>
  <input id="addr" placeholder="0x address" />
  <button onclick="run()">Check</button>
  <pre id="out">Enter an address.</pre>
  <script type="module">
    // Minimal client-side version of the CLI logic.
    // CORS must allow the public endpoints.

    const CHAINS = {
      ethereum: { rpc: 'https://ethereum-rpc.publicnode.com', native: 'ETH' },
      base: { rpc: 'https://base-rpc.publicnode.com', native: 'ETH' },
    };

    async function rpc(rpcUrl, method, params) {
      const res = await fetch(rpcUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', method, params, id: 1 }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      return data.result;
    }

    async function getNative(rpcUrl, address) {
      const wei = BigInt(await rpc(rpcUrl, 'eth_getBalance', [address, 'latest']));
      return Number(wei) / 1e18;
    }

    window.run = async () => {
      const address = document.getElementById('addr').value.trim();
      const out = document.getElementById('out');
      if (!address.startsWith('0x')) { out.textContent = 'Invalid address'; return; }
      out.textContent = 'Loading...';
      let text = `Portfolio for ${address}\n\n`;
      for (const [name, chain] of Object.entries(CHAINS)) {
        try {
          const bal = await getNative(chain.rpc, address);
          text += `${name}: ${bal.toFixed(6)} ${chain.native}\n`;
        } catch (e) {
          text += `${name}: error\n`;
        }
      }
      text += '\n(Full labels, tokens, transfers coming. Same public sources as the CLI.)';
      out.textContent = text;
    };
  </script>
</body>
</html>
